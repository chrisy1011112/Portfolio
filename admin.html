<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #18181d;
            color: white;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .top-bar h1 {
            margin: 0;
            font-size: 1.6rem;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-btn {
            padding: 9px 14px;
            border-radius: 8px;
            background: #2b2b34;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .nav-btn:hover {
            background: #383844;
        }
        .panel {
            background: #24242c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
        }
        .panel.danger-border {
            border-color: rgba(231, 76, 60, 0.5);
        }
        .panel h2 {
            margin: 0 0 12px 0;
            font-size: 1.2rem;
        }
        .field-label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
            font-size: 0.92rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #3c3c48;
            background: #17171c;
            color: white;
            font-size: 0.95rem;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .btn {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }
        .btn-warn { background: #e17055; }
        .btn-danger { background: #c0392b; }
        .btn-save { background: #28a745; }
        .btn:hover { opacity: 0.92; }
        .status-msg {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #7bed9f;
            min-height: 20px;
        }
        .status-msg.error {
            color: #ff7675;
        }
        .profile-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .profile-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #1a1a20;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .profile-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .profile-name {
            font-weight: bold;
            font-size: 1.05rem;
        }
        .tag-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .tag-pill-check {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #25252e;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .row-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .row-link {
            padding: 7px 11px;
            border-radius: 6px;
            background: #2f3542;
            color: #74b9ff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .row-btn {
            margin-top: 0;
            padding: 7px 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container" id="admin-loading">
        <div class="panel">
            <h2>Checking Staff Permissions...</h2>
            <p id="auth-message" style="color: #bbb; margin: 0;">Verifying your account and badges.</p>
        </div>
    </div>

    <div class="container" id="admin-content" style="display: none;">
        <div class="top-bar">
            <h1>Staff Admin Panel</h1>
            <div class="nav-links">
                <a class="nav-btn" href="dashboard.html">Dashboard</a>
                <a class="nav-btn" href="explore.html">Explore</a>
            </div>
        </div>

        <div class="panel">
            <h2>Website Shutdown Controls</h2>
            <label class="checkbox-row" for="site-shutdown-toggle">
                <input type="checkbox" id="site-shutdown-toggle">
                <span>Shut down website for visitors (shows offline screen on portfolio &amp; explore)</span>
            </label>

            <label class="field-label" for="shutdown-message-input">Shutdown Message:</label>
            <input type="text" id="shutdown-message-input" placeholder="The site is temporarily offline for maintenance.">

            <button type="button" class="btn btn-warn" id="save-site-status-btn">Save Site Status</button>
            <div id="site-status-msg" class="status-msg"></div>
        </div>

        <div class="panel danger-border">
            <h2>Manage User Tags &amp; Portfolios</h2>
            <p style="color: #bbb; margin: 0 0 10px 0; font-size: 0.9rem;">
                Assign or remove tags for any user, or delete a portfolio.
            </p>

            <label class="field-label" for="filter-profiles-input">Search Users:</label>
            <input type="text" id="filter-profiles-input" placeholder="Search username...">

            <div id="profiles-list" class="profile-list"></div>
            <div id="delete-status-msg" class="status-msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://osidyfibmwsktfoqjsdi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_QQXGFi2pk743FpoD1D5AlA_X-ZRGoXT';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const AVAILABLE_TAGS = ['owner', 'staff', 'beta', 'verified', 'friend'];
        let allProfiles = [];

        function setSiteStatus(msg, isError) {
            const el = document.getElementById('site-status-msg');
            el.textContent = msg;
            el.className = isError ? 'status-msg error' : 'status-msg';
        }

        function setManageStatus(msg, isError) {
            const el = document.getElementById('delete-status-msg');
            el.textContent = msg;
            el.className = isError ? 'status-msg error' : 'status-msg';
        }

        function hasStaffAccess(badges) {
            if (!Array.isArray(badges)) return false;
            const normalized = badges.map(function (b) { return String(b).trim().toLowerCase(); });
            return normalized.includes('staff') || normalized.includes('owner');
        }

        async function loadSiteConfig() {
            const { data, error } = await supabaseClient
                .from('site_config')
                .select('is_shutdown, shutdown_message')
                .eq('id', 1)
                .maybeSingle();

            if (error) {
                setSiteStatus('Could not load site status: ' + error.message, true);
                return;
            }

            if (data) {
                document.getElementById('site-shutdown-toggle').checked = Boolean(data.is_shutdown);
                document.getElementById('shutdown-message-input').value = data.shutdown_message || '';
            }
        }

        async function updateUserBadges(username, newBadges) {
            const { error } = await supabaseClient.rpc('staff_update_badges', {
                target_username: username,
                new_badges: newBadges
            });

            if (error) {
                setManageStatus('Failed to update tags: ' + error.message, true);
            } else {
                setManageStatus('Updated tags for "' + username + '"!', false);
                await loadProfilesForAdmin();
            }
        }

        function renderProfilesList() {
            const query = document.getElementById('filter-profiles-input').value.trim().toLowerCase();
            const listEl = document.getElementById('profiles-list');
            listEl.innerHTML = '';

            const matches = allProfiles.filter(function (p) {
                if (!p.username) return false;
                if (!query) return true;
                return p.username.toLowerCase().includes(query);
            });

            if (matches.length === 0) {
                const empty = document.createElement('p');
                empty.style.color = '#888';
                empty.style.fontSize = '0.9rem';
                empty.textContent = 'No matching portfolios found.';
                listEl.appendChild(empty);
                return;
            }

            matches.forEach(function (profile) {
                const currentBadges = Array.isArray(profile.badges)
                    ? profile.badges.map(function (b) { return String(b).trim().toLowerCase(); })
                    : [];

                const row = document.createElement('div');
                row.className = 'profile-row';

                const top = document.createElement('div');
                top.className = 'profile-top';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'profile-name';
                nameSpan.textContent = profile.username;

                const actions = document.createElement('div');
                actions.className = 'row-actions';

                const viewLink = document.createElement('a');
                viewLink.className = 'row-link';
                viewLink.href = 'portfolio.html?u=' + encodeURIComponent(profile.username);
                viewLink.target = '_blank';
                viewLink.rel = 'noopener noreferrer';
                viewLink.textContent = 'View';

                const saveTagsBtn = document.createElement('button');
                saveTagsBtn.type = 'button';
                saveTagsBtn.className = 'btn btn-save row-btn';
                saveTagsBtn.textContent = 'Save Tags';

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'btn btn-danger row-btn';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', function () {
                    deletePortfolioByUsername(profile.username);
                });

                actions.appendChild(viewLink);
                actions.appendChild(saveTagsBtn);
                actions.appendChild(delBtn);

                top.appendChild(nameSpan);
                top.appendChild(actions);

                const tagsWrap = document.createElement('div');
                tagsWrap.className = 'tag-checkboxes';

                const checkboxes = [];
                AVAILABLE_TAGS.forEach(function (tag) {
                    const lbl = document.createElement('label');
                    lbl.className = 'tag-pill-check';

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = tag;
                    cb.checked = currentBadges.includes(tag);
                    checkboxes.push(cb);

                    const txt = document.createElement('span');
                    txt.textContent = tag.toUpperCase();

                    lbl.appendChild(cb);
                    lbl.appendChild(txt);
                    tagsWrap.appendChild(lbl);
                });

                saveTagsBtn.addEventListener('click', function () {
                    const selected = checkboxes
                        .filter(function (cb) { return cb.checked; })
                        .map(function (cb) { return cb.value; });
                    updateUserBadges(profile.username, selected);
                });

                row.appendChild(top);
                row.appendChild(tagsWrap);
                listEl.appendChild(row);
            });
        }

        async function loadProfilesForAdmin() {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('id, username, badges')
                .order('username', { ascending: true });

            if (error) {
                setManageStatus('Error loading profiles: ' + error.message, true);
                return;
            }

            allProfiles = data || [];
            renderProfilesList();
        }

        async function deletePortfolioByUsername(username) {
            const clean = String(username || '').trim();
            if (!clean) return;

            const ok = confirm('Delete portfolio for "' + clean + '"? This cannot be undone.');
            if (!ok) return;

            const { error } = await supabaseClient.rpc('staff_delete_profile', {
                target_username: clean
            });

            if (error) {
                setManageStatus('Delete failed: ' + error.message, true);
            } else {
                setManageStatus('Deleted portfolio for "' + clean + '".', false);
                await loadProfilesForAdmin();
            }
        }

        document.getElementById('save-site-status-btn').addEventListener('click', async function () {
            const isShutdown = document.getElementById('site-shutdown-toggle').checked;
            const message = document.getElementById('shutdown-message-input').value.trim() ||
                'The site is temporarily offline for maintenance.';

            const { error } = await supabaseClient.rpc('staff_set_site_config', {
                new_shutdown: isShutdown,
                new_message: message
            });

            if (error) {
                setSiteStatus('Failed to update site status: ' + error.message, true);
            } else {
                setSiteStatus(
                    isShutdown ? 'Website is now SHUT DOWN for non-staff visitors.' : 'Website is now LIVE.',
                    false
                );
            }
        });

        document.getElementById('filter-profiles-input').addEventListener('input', renderProfilesList);

        async function initAdmin() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
                return;
            }

            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('badges')
                .eq('id', user.id)
                .maybeSingle();

            if (profileError || !profile || !hasStaffAccess(profile.badges)) {
                document.getElementById('auth-message').textContent =
                    'Access denied: you need the "staff" or "owner" badge to view this page.';
                return;
            }

            document.getElementById('admin-loading').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';

            await loadSiteConfig();
            await loadProfilesForAdmin();
        }

        initAdmin();
    </script>
</body>
</html>
